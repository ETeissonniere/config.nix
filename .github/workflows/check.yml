name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check all host configurations
        run: |
          hosts=$(nix eval --json "path:$PWD#darwinConfigurations" --apply builtins.attrNames | jq -r '.[]')
          for host in $hosts; do
            make check HOST="$host"
          done
      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code
